# SPDX-License-Identifier: MPL-2.0
# Signed application package (.nbt) from a vMAJOR.MINOR.PATCH tag, called by
# application repositories (docs/manager-release.md, "CI releases"):
#
#   on:
#     push:
#       tags: ["v*"]
#   permissions: {}
#   jobs:
#     release:
#       uses: NBTFoundry/manager/.github/workflows/app-release.yml@<manager commit>
#       permissions:
#         contents: write
#         packages: read
#       secrets: inherit
#       with:
#         sdk-ref: <NBTFoundry/sdk commit>
#         build: make -j"$(nproc)" guest
#         payload: build/nbt-doom.guest
#
# By default the build runs on a plain runner with the SDK's own toolchain (the
# job runs make -C ../sdk toolchain first): a module or guest for nbt-runner
# (bridge capability runner), or a native program built with the toolchain's QNX
# target. Only a build that needs the QNX SDP sets qnx: true, and then needs
# access to the private QNX image. An application whose build needs its Git LFS
# files (game data it embeds) sets lfs: true (not with qnx: true).
#
# The caller's release/package.args describes the package (tools/package.py @FILE).
# The signing key comes from the caller's "release" environment (secret APPS_SIGNING_KEY,
# base64 of the PEM). By default it is NBTFoundry's apps key and must be the pair of this
# repository's release/apps-public.pem, the key every manager trusts. A developer's own
# repository sets public-key to its own public key file instead: the package then installs
# on cars that added that key from the phone app (PROTOCOL.md, "Developer keys"). Signing
# is the sign-package action (.github/actions/sign-package), which such a repository can
# also use on its own. A called workflow sees the caller's environment secrets
# only with "secrets: inherit"; keep no repository-level secrets in the caller, since
# inherit passes those too. Each job holds only what it needs:
#   build    private QNX image (or none, qnx: false), no secret; produces the
#            unsigned executable
#   sign     the release environment; runs only the sign-package action and
#            tools/package.py from this workflow's commit, never build output
#   verify   nbt-verify built from this workflow's commit; holds nothing
#   publish  contents:write; runs nothing from the build
#
# NBTFoundry/community-apps builds another repository's application with it:
# repository and ref (a commit) name the source, version replaces the tag, app is
# the id the package must declare, and the release is tagged <app>-vX.Y.Z in the
# caller's repository. publish: false only builds (a pull request's check).
name: Application release

on:
  workflow_call:
    inputs:
      sdk-ref:
        description: The NBTFoundry/sdk commit the application builds against (checked out at ../sdk)
        type: string
        required: true
      build:
        description: Command that builds the executable in the QNX image, run in the application's root
        type: string
        required: true
      payload:
        description: The executable it produces, relative to the application's root
        type: string
        required: true
      package-args:
        description: The package description, one tools/package.py argument per line
        type: string
        default: release/package.args
      qnx:
        description: Build in the private QNX image (the QNX SDP); false (default) builds with the SDK's toolchain only
        type: boolean
        default: false
      lfs:
        description: Fetch the application's Git LFS files for the build (with qnx false; the QNX image has no git-lfs)
        type: boolean
        default: false
      public-key:
        description: The caller's own public key (PEM, RSA-3072) to sign for, a developer key; empty for NBTFoundry's apps key
        type: string
        default: ""
      repository:
        description: Build this repository's application (owner/name) instead of the caller's; needs ref and version
        type: string
        default: ""
      ref:
        description: The commit of repository to build (40 hex digits)
        type: string
        default: ""
      version:
        description: X.Y.Z instead of the tag's; the release is tagged <app>-vX.Y.Z
        type: string
        default: ""
      app:
        description: The application id the package description must declare (empty for any)
        type: string
        default: ""
      publish:
        description: Sign, verify and publish; false only builds
        type: boolean
        default: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    container:
      # ci/qnx/README.md; the same image as release.yml. No image (qnx: false):
      # the job runs on the runner itself.
      image: ${{ inputs.qnx && 'ghcr.io/nbtfoundry/qnx65-build@sha256:42d6791ab5be8e04243c4c423309e2450559896824ef87d64ccbb8bab88358fc' || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      app: ${{ steps.meta.outputs.app }}
      compat: ${{ steps.meta.outputs.compat }}
      version: ${{ steps.meta.outputs.version }}
      sequence: ${{ steps.meta.outputs.sequence }}
      payload: ${{ steps.meta.outputs.payload }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Source
        env:
          REPOSITORY: ${{ inputs.repository }}
          REF: ${{ inputs.ref }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$REPOSITORY" ]]; then
            [[ "$REPOSITORY" =~ ^[A-Za-z0-9-]{1,39}/[A-Za-z0-9._-]{1,100}$ && "$REF" =~ ^[0-9a-f]{40}$ && -n "$VERSION" ]] \
              || { echo "::error::repository needs a 40-digit ref and a version"; exit 1; }
          elif [[ -n "$REF" ]]; then
            echo "::error::ref goes with repository"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          path: app
          persist-credentials: false
          lfs: ${{ inputs.lfs }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NBTFoundry/sdk
          ref: ${{ inputs.sdk-ref }}
          path: sdk
          persist-credentials: false
      - name: Fetch submodules
        run: |
          git config --global --add safe.directory '*'
          for repository in app sdk; do
            git -C "$repository" -c url.https://github.com/.insteadOf=git@github.com: \
              submodule update --init --recursive --depth 1
          done
      - name: Version, sequence and package identity
        id: meta
        env:
          ARGS: app/${{ inputs.package-args }}
          PAYLOAD: ${{ inputs.payload }}
          VERSION: ${{ inputs.version }}
          EXPECTED_APP: ${{ inputs.app }}
        run: |
          # vX.Y.Z, each part below 1000: sequence X*1000000 + Y*1000 + Z, so a
          # later tag always updates an earlier package.
          tag="${VERSION:+v$VERSION}"
          tag="${tag:-$GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$ ]]; then
            echo "::error::release tags are vMAJOR.MINOR.PATCH, each part below 1000"
            exit 1
          fi
          sequence=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          (( sequence > 0 )) || { echo "::error::v0.0.0 is not a release"; exit 1; }
          value() { awk -v name="$1" 'found { print; exit } $0 == name { found = 1 }' "$ARGS"; }
          app="$(value --app)"
          compat="$(value --compat)"
          [[ "$app" =~ ^[a-z0-9_-]{1,48}$ && "$compat" =~ ^[a-z0-9_.-]{1,48}$ ]] \
            || { echo "::error::$ARGS must give --app and --compat"; exit 1; }
          [[ -z "$EXPECTED_APP" || "$app" == "$EXPECTED_APP" ]] \
            || { echo "::error::the package is $app, not $EXPECTED_APP"; exit 1; }
          {
            echo "app=$app"
            echo "compat=$compat"
            echo "version=${tag#v}"
            echo "tag=${VERSION:+$app-}$tag"
            echo "sequence=$sequence"
            echo "payload=$(basename "$PAYLOAD")"
          } >>"$GITHUB_OUTPUT"
      - name: The SDK's toolchain (without the QNX SDP)
        if: ${{ !inputs.qnx }}
        run: make -C sdk toolchain
      - name: Build
        working-directory: app
        env:
          BUILD: ${{ inputs.build }}
          PAYLOAD: ${{ inputs.payload }}
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_SEQ: ${{ steps.meta.outputs.sequence }}
          NBT_SDK_DIR: ../sdk
        run: |
          bash -eo pipefail -c "$BUILD"
          mkdir -p ../out
          cp "$PAYLOAD" ../out/
          sha256sum ../out/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: out
          if-no-files-found: error
          retention-days: 3

  sign:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    outputs:
      key-id: ${{ steps.sign.outputs.key-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          path: app
          persist-credentials: false
          sparse-checkout: |
            ${{ inputs.package-args }}
            ${{ inputs.public-key || inputs.package-args }}
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: manager
          persist-credentials: false
          sparse-checkout: |
            .github/actions/sign-package
            tools/package.py
            tools/bridge.py
            release/apps-public.pem
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: unsigned
      - name: Sign
        id: sign
        uses: ./manager/.github/actions/sign-package
        with:
          signing-key: ${{ secrets.APPS_SIGNING_KEY }}
          public-key: ${{ inputs.public-key && format('app/{0}', inputs.public-key) || '' }}
          package-args: app/${{ inputs.package-args }}
          version: ${{ needs.build.outputs.version }}
          sequence: ${{ needs.build.outputs.sequence }}
          payload: unsigned/${{ needs.build.outputs.payload }}
          output: signed/${{ needs.build.outputs.app }}-${{ needs.build.outputs.version }}.nbt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: signed
          if-no-files-found: error
          retention-days: 3

  verify:
    needs: [build, sign]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ inputs.public-key != '' }}
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.ref }}
          path: app
          persist-credentials: false
          sparse-checkout: ${{ inputs.public-key }}
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: manager
          persist-credentials: false
      - name: Build nbt-verify
        working-directory: manager
        run: |
          sudo apt-get install -y --no-install-recommends libssl-dev zlib1g-dev >/dev/null
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --depth 1 third_party/lvgl
          make -j"$(nproc)" "$PWD/build/nbt-verify"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: signed
      - name: Verify the signed package
        id: verify
        env:
          APP: ${{ needs.build.outputs.app }}
          COMPAT: ${{ needs.build.outputs.compat }}
          VERSION: ${{ needs.build.outputs.version }}
          SEQUENCE: ${{ needs.build.outputs.sequence }}
          PUBLIC_KEY: ${{ inputs.public-key && format('app/{0}', inputs.public-key) || 'manager/release/apps-public.pem' }}
        run: |
          package="signed/$APP-$VERSION.nbt"
          out="$(manager/build/nbt-verify "$package" "$PUBLIC_KEY" "$APP" "$COMPAT")"
          echo "$out"
          grep -qxF "version=$VERSION" <<<"$out" && grep -qxF "sequence=$SEQUENCE" <<<"$out" \
            || { echo "::error::the package does not carry version $VERSION, sequence $SEQUENCE"; exit 1; }
          echo "sha256=$(sha256sum "$package" | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

  publish:
    needs: [build, sign, verify]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP: ${{ needs.build.outputs.app }}
          COMPAT: ${{ needs.build.outputs.compat }}
          VERSION: ${{ needs.build.outputs.version }}
          SEQUENCE: ${{ needs.build.outputs.sequence }}
          VERIFIED: ${{ needs.verify.outputs.sha256 }}
          MANAGER: ${{ job.workflow_repository }}@${{ job.workflow_sha }}
          PUBLIC_KEY: ${{ inputs.public-key }}
          KEY_ID: ${{ needs.sign.outputs.key-id }}
          TAG: ${{ needs.build.outputs.tag }}
          SOURCE: ${{ inputs.repository && format('{0}@{1}', inputs.repository, inputs.ref) || github.sha }}
          TARGET: ${{ inputs.repository && format('--target={0}', github.sha) || '--verify-tag' }}
        run: |
          package="dist/$APP-$VERSION.nbt"
          [[ "$(sha256sum "$package" | cut -d' ' -f1)" == "$VERIFIED" ]] \
            || { echo "::error::the package differs from the verified one"; exit 1; }
          (cd dist && sha256sum "$APP-$VERSION.nbt" >SHA256SUMS)
          if [[ -n "$PUBLIC_KEY" ]]; then
            print="${KEY_ID:0:4} ${KEY_ID:4:4} ${KEY_ID:8:4} ${KEY_ID:12:4}"
            signed="Signed with the developer key \`$PUBLIC_KEY\` (fingerprint \`$print\`). Add that key on the car first, from the phone app (Developer keys)"
          else
            signed="Signed with the apps key that NBT Manager trusts ($MANAGER, \`release/apps-public.pem\`)"
          fi
          cat >notes.md <<EOF
          \`$APP\` $VERSION: package sequence $SEQUENCE, compatibility \`$COMPAT\`.

          $signed; built from $SOURCE by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).
          Install it from the phone app.
          EOF
          prerelease=()
          [[ "$VERSION" == 0.* ]] && prerelease=(--prerelease)
          gh release create "$TAG" "$TARGET" --title "$APP $VERSION" \
            --notes-file notes.md "${prerelease[@]}" "$package" dist/SHA256SUMS
